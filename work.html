<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery — Adriano Lezama</title>
  <link href="https://fonts.googleapis.com/css2?family=GFS+Didot&family=Jost:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; font-size: 16px; }

    :root {
      --bg: #0e0e0e;
      --bg2: #141414;
      --border: rgba(255,255,255,0.07);
      --text: #e2e2e2;
      --muted: #888;
      --accent: #c8a96e;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: Futura, 'Jost', 'Century Gothic', 'Trebuchet MS', sans-serif;
      font-weight: 300;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    ::-webkit-scrollbar { width: 2px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--accent); }

    a { text-decoration: none; color: inherit; }

    /* ─── NAV ─── */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 5vw;
      height: 130px;
      background: transparent;
      border-bottom: none;
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                  background 0.3s ease;
    }
    nav.bg { background: transparent; backdrop-filter: none; -webkit-backdrop-filter: none; }
    .nav-left { display: flex; align-items: center; gap: 2.2rem; flex: 1; }
    .nav-left a {
      font-size: 0.85rem; letter-spacing: 0.14em; text-transform: uppercase;
      color: #fff; transition: color 0.2s;
    }
    .nav-left a:hover, .nav-left a.active { color: var(--accent); }
    .nav-center { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
    .nav-logo { display: flex; align-items: center; }
    .nav-logo img { height: 80px; width: auto; opacity: 0.92; transition: opacity 0.2s; }
    .nav-logo:hover img { opacity: 1; }
    .nav-links { display: flex; align-items: center; gap: 2rem; }
    .nav-links a { font-size: 0.85rem; letter-spacing: 0.14em; text-transform: uppercase; color: #fff; transition: color 0.2s; }
    .nav-links a:hover, .nav-links a.active { color: var(--accent); }
    .nav-right { display: flex; align-items: center; gap: 1.4rem; justify-content: flex-end; flex: 1; }
    .nav-icon { display: flex; align-items: center; color: #fff; transition: color 0.2s; }
    .nav-icon:hover { color: var(--accent); }
    .nav-hamburger { display: none; background: none; border: none; cursor: pointer; color: var(--muted); padding: 4px; }
    @media (max-width: 640px) {
      .nav-left { display: none; }
      .nav-right { display: none; }
      .nav-links { display: none; }
      .nav-logo img { height: 55px; }
      nav { height: 80px; }
      .nav-hamburger { display: flex; position: absolute; right: 5vw; }
    }
    #mobile-menu {
      display: none; position: fixed; inset: 0;
      background: rgba(14,14,14,0.98); z-index: 200;
      flex-direction: column; align-items: center; justify-content: center; gap: 2.8rem;
    }
    #mobile-menu a {
      font-family: 'GFS Didot', Didot, 'Bodoni MT', serif;
      font-size: clamp(2.5rem, 10vw, 4rem); color: var(--text);
      letter-spacing: 0.04em; transition: color 0.2s;
    }
    #mobile-menu a:hover { color: var(--accent); }
    #mobile-close { position: absolute; top: 20px; right: 24px; background: none; border: none; cursor: pointer; color: var(--muted); transition: color 0.2s; }
    #mobile-close:hover { color: var(--text); }

    /* ─── SPLIT LAYOUT ─── */
    .split-container {
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    .split-panel {
      position: relative;
      flex: 1;
      overflow: hidden;
      cursor: pointer;
      transition: flex 0.7s cubic-bezier(0.77, 0, 0.18, 1);
    }
    .split-panel:hover { flex: 1.18; }

    .split-panel img {
      position: absolute; inset: 0;
      width: 100%; height: 100%; object-fit: cover;
      transition: transform 0.9s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      will-change: transform;
    }
    .split-panel:hover img { transform: scale(1.05); }

    .split-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(
        to top,
        rgba(0,0,0,0.82) 0%,
        rgba(0,0,0,0.18) 55%,
        rgba(0,0,0,0.05) 100%
      );
    }

    /* Vertical divider */
    .split-divider {
      position: absolute; top: 0; right: 0; bottom: 0;
      width: 1px; background: rgba(255,255,255,0.12);
      z-index: 2; pointer-events: none;
    }

    .split-content {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      justify-content: flex-end;
      padding: 48px 40px;
      z-index: 3;
    }

    .split-league {
      font-size: 0.54rem; letter-spacing: 0.32em; text-transform: uppercase;
      color: var(--accent); margin-bottom: 10px;
      opacity: 0; transform: translateY(8px);
      transition: opacity 0.4s ease 0.05s, transform 0.4s cubic-bezier(0.22,1,0.36,1) 0.05s;
    }
    .split-panel:hover .split-league { opacity: 1; transform: translateY(0); }

    .split-title {
      font-family: 'GFS Didot', Didot, 'Bodoni MT', serif;
      font-size: clamp(1.6rem, 3vw, 2.6rem); font-weight: 400;
      color: #fff; letter-spacing: 0.01em; line-height: 1.1;
      transform: translateY(6px);
      transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .split-panel:hover .split-title { transform: translateY(0); }

    .split-meta {
      margin-top: 14px;
      display: flex; align-items: center; gap: 12px;
      font-size: 0.56rem; letter-spacing: 0.22em; text-transform: uppercase;
      color: rgba(255,255,255,0.45);
    }

    .split-arrow {
      display: inline-flex; align-items: center; justify-content: center;
      width: 36px; height: 36px; border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.25);
      color: #fff; font-size: 0.85rem;
      margin-left: auto;
      opacity: 0; transform: translateX(-10px);
      transition: opacity 0.35s ease, transform 0.35s cubic-bezier(0.22,1,0.36,1),
                  border-color 0.25s ease, background 0.25s ease;
    }
    .split-panel:hover .split-arrow {
      opacity: 1; transform: translateX(0);
      border-color: var(--accent); background: rgba(200,169,110,0.12);
      color: var(--accent);
    }

    /* Mobile: stack vertically + always show content */
    @media (max-width: 640px) {
      .split-container { flex-direction: column; height: auto; }
      .split-panel { flex: none; height: 72vw; min-height: 280px; }
      .split-panel:hover { flex: none; }
      .split-divider { display: none; }
      .split-content { padding: 28px 24px; }
      .split-title { font-size: clamp(1.3rem, 5vw, 1.8rem); transform: none; }
      .split-league { opacity: 1; transform: none; }
      .split-arrow { opacity: 1; transform: none; border-color: rgba(255,255,255,0.3); }
      .split-overlay { background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.08) 55%, rgba(0,0,0,0.04) 100%); }
    }

    /* ─── LOGOS MARQUEE ─── */
    .logos-strip { padding: 28px 0; background: transparent; overflow: hidden; position: relative; }
    .logos-strip-label { text-align: center; font-size: 0.6rem; letter-spacing: 0.22em; text-transform: uppercase; color: rgba(255,255,255,0.2); margin-bottom: 18px; }
    .logos-strip::before, .logos-strip::after { content: ''; position: absolute; top: 0; bottom: 0; width: 100px; z-index: 2; pointer-events: none; }
    .logos-strip::before { left: 0; background: linear-gradient(to right, #0e0e0e, transparent); }
    .logos-strip::after  { right: 0; background: linear-gradient(to left, #0e0e0e, transparent); }
    .logos-track { display: flex; align-items: center; gap: 72px; width: max-content; animation: logos-scroll 24s linear infinite; }
    .logos-track img { height: 52px; width: auto; opacity: 0.5; filter: brightness(1.3); transition: opacity 0.25s; flex-shrink: 0; user-select: none; }
    .logos-track img:hover { opacity: 0.9; }
    @keyframes logos-scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }

    /* ─── BOOK CTA ─── */
    .book-cta {
      padding: 100px 5vw; text-align: center; border-top: 1px solid var(--border);
      display: flex; flex-direction: column; align-items: center; gap: 18px;
    }
    .book-cta-eyebrow { font-size: 0.58rem; letter-spacing: 0.28em; text-transform: uppercase; color: var(--accent); }
    .book-cta-title {
      font-family: 'GFS Didot', Didot, 'Bodoni MT', serif;
      font-size: clamp(2rem, 4vw, 3.2rem); font-weight: 400;
      letter-spacing: -0.02em; color: #fff; line-height: 1.05;
    }
    .book-cta-sub { font-size: 0.8rem; color: var(--muted); max-width: 360px; line-height: 1.8; }
    .book-cta-btn {
      display: inline-block; margin-top: 8px; padding: 14px 44px;
      border: 1px solid rgba(200,169,110,0.5); color: var(--accent);
      font-size: 0.63rem; letter-spacing: 0.22em; text-transform: uppercase;
      background: transparent; border-radius: 4px;
      transition: background 0.3s ease;
    }
    .book-cta-btn:hover { background: rgba(200,169,110,0.1); }

    /* ─── FOOTER ─── */
    footer {
      padding: 28px 5vw; border-top: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 20px;
    }
    .footer-brand { display: flex; flex-direction: column; gap: 5px; }
    .footer-name { font-family: 'GFS Didot', Didot, 'Bodoni MT', serif; font-size: 0.9rem; letter-spacing: 0.05em; color: var(--muted); }
    .footer-tagline { font-size: 0.52rem; letter-spacing: 0.18em; text-transform: uppercase; color: #555; }
    .footer-links { display: flex; align-items: center; gap: 1.8rem; flex-wrap: wrap; justify-content: center; }
    .footer-links a { font-size: 0.56rem; letter-spacing: 0.18em; text-transform: uppercase; color: #555; transition: color 0.2s; }
    .footer-links a:hover { color: var(--text); }
    .footer-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
    .footer-ig { font-size: 0.56rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); transition: color 0.2s; }
    .footer-ig:hover { color: var(--text); }
    .footer-copy { font-size: 0.52rem; letter-spacing: 0.16em; text-transform: uppercase; color: #555; }
    @media (max-width: 640px) { footer { flex-direction: column; align-items: center; text-align: center; gap: 24px; } .footer-right { align-items: center; } }

    /* ── Top navigation ── */
    .site-nav { position: fixed; top: 0; left: 0; right: 0; z-index: 200; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; height: 110px; }
    .site-nav-left  { display: flex; align-items: center; gap: 2.5rem; justify-content: center; }
    .site-nav-center { display: flex; align-items: center; justify-content: center; padding: 0 3vw; }
    .site-nav-center img { height: 110px; width: auto; opacity: 0.92; transition: opacity 0.2s; }
    .site-nav-center:hover img { opacity: 1; }
    .site-nav-right { display: flex; align-items: center; gap: 2.5rem; justify-content: center; }
    .site-nav-left a, .site-nav-right a { font-size: 0.75rem; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,0.55); transition: color 0.2s; text-decoration: none; }
    .site-nav-left a:hover, .site-nav-right a:hover { color: #fff; }
    .site-nav-right .book-link { color: #0e0e0e !important; background: #c8a96e; border-radius: 999px; padding: 7px 18px; letter-spacing: 0.12em; transition: background 0.2s, transform 0.15s; }
    .site-nav-right .book-link:hover { background: #dfc088 !important; color: #0e0e0e !important; transform: translateY(-1px); }
    .site-nav-right .lang-btn { background: none; border: 1px solid rgba(255,255,255,0.2); cursor: pointer; font-size: 0.65rem; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(255,255,255,0.55); padding: 4px 10px; border-radius: 4px; transition: color 0.2s, border-color 0.2s; font-family: inherit; }
    .site-nav-right .lang-btn:hover { color: #fff; border-color: rgba(255,255,255,0.5); }
    #site-mobile-menu .lang-btn { background: none; border: 1px solid rgba(255,255,255,0.2); cursor: pointer; font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(255,255,255,0.6); padding: 10px 28px; border-radius: 6px; font-family: inherit; transition: color 0.2s, border-color 0.2s; }
    #site-mobile-menu .lang-btn:hover { color: #fff; border-color: rgba(255,255,255,0.5); }
    .site-nav-hamburger { display: none; background: none; border: none; cursor: pointer; color: rgba(255,255,255,0.65); padding: 8px; position: absolute; right: 5vw; top: 50%; transform: translateY(-50%); z-index: 201; transition: color 0.2s; }
    .site-nav-hamburger:hover { color: #fff; }
    @media (max-width: 640px) {
      .site-nav { height: 70px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; background: linear-gradient(to bottom, rgba(14,14,14,0.7) 0%, transparent 100%); }
      .site-nav-center img { height: 55px; }
      .site-nav-left a, .site-nav-right { display: none; }
      .site-nav-hamburger { display: flex; }
    }
    #site-mobile-menu {
      display: none; position: fixed; inset: 0; z-index: 300;
      background: rgba(14,14,14,0.98);
      flex-direction: column; align-items: center; justify-content: center; gap: 2.6rem;
    }
    #site-mobile-menu.open { display: flex; }
    #site-mobile-menu a {
      font-family: 'GFS Didot', Didot, 'Bodoni MT', Georgia, serif;
      font-size: clamp(2rem, 8vw, 3.2rem);
      color: rgba(255,255,255,0.82);
      letter-spacing: 0.04em;
      transition: color 0.2s;
      text-decoration: none;
    }
    #site-mobile-menu a:hover { color: #c8a96e; }
    #site-mobile-menu .book-link { color: #0e0e0e !important; background: #c8a96e; border-radius: 999px; padding: 10px 32px; }
    #site-menu-close {
      position: absolute; top: 22px; right: 22px;
      background: none; border: none; cursor: pointer;
      color: rgba(255,255,255,0.4); transition: color 0.2s; padding: 8px;
    }
    #site-menu-close:hover { color: #fff; }
  </style>
</head>
<body>
<nav class="site-nav">
  <div class="site-nav-left">
    <button class="lang-btn" onclick="toggleLang()">FR</button>
    <a href="work.html">Gallery</a>
    <a href="about.html">About</a>
  </div>
  <a href="index.html" class="site-nav-center"><img src="AL.svg" alt="Adriano Lezama Photography"></a>
  <div class="site-nav-right">
    <a href="contact.html">Contact</a>
    <a href="book.html" class="book-link">Book</a>
  </div>
  <button class="site-nav-hamburger" id="site-menu-open" aria-label="Open menu">
    <svg width="22" height="16" viewBox="0 0 22 16" fill="none"><line x1="0" y1="1" x2="22" y2="1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="0" y1="8" x2="22" y2="8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="0" y1="15" x2="22" y2="15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
  </button>
</nav>
<div id="site-mobile-menu">
  <button id="site-menu-close" aria-label="Close menu">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><line x1="2" y1="2" x2="18" y2="18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="18" y1="2" x2="2" y2="18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
  </button>
  <a href="work.html">Gallery</a>
  <a href="about.html">About</a>
  <a href="contact.html">Contact</a>
  <button class="lang-btn" onclick="toggleLang()">FR</button>
  <a href="book.html" class="book-link">Book</a>
</div>
<script>
(function(){
  var open = document.getElementById('site-menu-open');
  var close = document.getElementById('site-menu-close');
  var menu = document.getElementById('site-mobile-menu');
  if(open) open.addEventListener('click', function(){ menu.classList.add('open'); document.body.style.overflow='hidden'; });
  if(close) close.addEventListener('click', function(){ menu.classList.remove('open'); document.body.style.overflow=''; });
})();
</script>

<script>
  const clubs = [
    {
      slug: 'cs-st-laurent',
      label: 'LS PRO',
      cover: 'photos/DSC01452-copy.jpg',
      year: '2026',
      league: null,
    },
    {
      slug: 'college-charles-lemoyne',
      label: 'Collège Charles-Lemoyne',
      cover: 'photos/DSC08483.jpg',
      year: '2026',
      league: null,
    },
  ];

  function renderSplit() {
    const container = document.getElementById('split-container');
    container.innerHTML = clubs.map((club, i) => `
      <a class="split-panel" href="gallery.html?team=${club.slug}" aria-label="${club.label}">
        <img src="${club.cover}" alt="${club.label}" loading="${i === 0 ? 'eager' : 'lazy'}">
        <div class="split-overlay"></div>
        ${i < clubs.length - 1 ? '<div class="split-divider"></div>' : ''}
        <div class="split-content">
          ${club.league ? `<span class="split-league">${club.league}</span>` : ''}
          <span class="split-title">${club.label}</span>
          <div class="split-meta">
            <span>${club.year}</span>
            <span class="split-arrow">→</span>
          </div>
        </div>
      </a>`).join('');
  }

  // ── Init ──
  renderSplit();

  // ── Cart badge ──
  (function(){
    const n = JSON.parse(localStorage.getItem('al_cart')||'[]').reduce((s,i)=>s+i.qty,0);
    const b = document.getElementById('cart-badge');
    if(b&&n>0){b.textContent=n;b.classList.add('has-items');}
  })();
</script>
<script src="lang.js"></script>
